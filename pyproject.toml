[build-system]
requires = ["setuptools>=77"]   # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "ptbp"
version = "0.3.0"
description = "Density functional Tight-binding theory Parameterization (PTBP)."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# pydftb is a package of its own (pydftb/pyproject.toml).  PEP 508 has no portable relative
# path, so install both from a checkout: pip install ./pydftb .   (dev: pip install -e ./pydftb -e .)
dependencies = [
    "pydftb>=0.1.0.dev0",   # not ">=0.1": that excludes the pre-release 0.1.0.dev0
    "ase>=3.22",
    "scikit-optimize>=0.10",
    "scipy",
    "numpy",
    "matplotlib",
    "sympy",
    "pandas",
    "pyswarms",
    "pyyaml",
    "textual",
    "threadpoolctl",
]

[project.optional-dependencies]
# pydftb's extras, passed through (the engine itself needs numpy, scipy, ase, threadpoolctl)
torch = ["pydftb[torch]"]             # torch backend: GPU / autodiff (milestone M4; tested 2.14.1)
dispersion = ["pydftb[dispersion]"]   # D3/D4 dispersion (M2d); conda: dftd3-python, dftd4-python
mpi = ["mpi4py"]                      # multi-node task farming (milestone M3)
dev = ["pytest"]

# pylibxc, hotcent, dftbplus are NOT on PyPI — install via conda-forge
# (see README.md "Installation & Notes").

[project.scripts]
ptbp = "parameterize:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["parameterize"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "utils*", "tools*"]
exclude = ["dataset*", "test*", "results*", "dft*", "tests*", "examples*", "pydftb*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pydftb/tests"]
markers = [
    "slow: end-to-end tests that invoke ptbp / hotcent / DFTB+ (skip with `pytest -m 'not slow'`)",
]
addopts = "-ra"

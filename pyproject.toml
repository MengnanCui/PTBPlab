[build-system]
requires = ["setuptools>=77"]   # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "ptbp"
version = "0.2.0"
description = "Density functional Tight-binding theory Parameterization (PTBP)."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ase>=3.22",
    "scikit-optimize>=0.10",
    "scipy",
    "numpy",
    "matplotlib",
    "sympy",
    "pandas",
    "pyswarms",
    "pyyaml",
    "textual",
    "threadpoolctl",
]

[project.optional-dependencies]
# pydftb extras (the core engine only needs numpy, scipy and ase)
torch = ["torch>=2.14"]           # torch backend: GPU / autodiff (milestone M4; tested 2.14.1)
dispersion = ["dftd3", "dftd4"]   # D3/D4 dispersion (M2d); conda: dftd3-python, dftd4-python
mpi = ["mpi4py"]                  # multi-node task farming (milestone M3)
dev = ["pytest"]

# pylibxc, hotcent, dftbplus are NOT on PyPI — install via conda-forge
# (see README.md "Installation & Notes").

[project.scripts]
ptbp = "parameterize:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["parameterize"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "utils*", "tools*", "pydftb*"]
exclude = ["dataset*", "test*", "results*", "dft*", "tests*", "examples*", "pydftb.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pydftb/tests"]
markers = [
    "slow: end-to-end tests that invoke ptbp / hotcent / DFTB+ (skip with `pytest -m 'not slow'`)",
]
addopts = "-ra"
